services:
  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    ports:
      - "3000:3000"
    environment:
      FLASK_BACKEND_URL: http://backend:5000
    depends_on:
      - backend
